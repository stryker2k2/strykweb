log_format downloads '$time_local | $remote_addr | $status | $body_bytes_sent bytes | "$request" | "$http_user_agent"';

# Catch-all for requests that don't match one of our real hostnames — raw-IP
# scans, bad Host headers, SNI-less/mismatched probes. No redirect, no cert,
# no response: closes the connection outright instead of confirming a domain.
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;

    ssl_reject_handshake on;

    return 444;
}

server {
    listen 80;
    server_name strykersoft.us www.strykersoft.us dev.strykersoft.us;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://strykersoft.us$request_uri;
    }
}

# Canonicalize www to the apex domain over HTTPS too
server {
    listen 443 ssl;
    http2 on;
    server_name www.strykersoft.us;

    ssl_certificate /etc/letsencrypt/live/dev.strykersoft.us/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.strykersoft.us/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://strykersoft.us$request_uri;
}

# dev.strykersoft.us proxies to the Vite dev server (vite-dev service) instead
# of the built site, so the in-progress frontend is reachable without a :5173
# port and without exposing that port outside the compose network.
server {
    listen 443 ssl;
    http2 on;
    server_name dev.strykersoft.us;

    ssl_certificate /etc/letsencrypt/live/dev.strykersoft.us/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.strykersoft.us/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://vite-dev:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Vite's HMR client needs a websocket, not just plain HTTP
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name strykersoft.us;

    ssl_certificate /etc/letsencrypt/live/dev.strykersoft.us/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.strykersoft.us/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none';" always;

    root /var/www/html;
    index index.html;

    # React SPA — send all routes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Download counter API
    location /api/ {
        proxy_pass http://api:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Addon / project downloads
    location /dist/ {
        alias /var/www/dist/;
        autoindex off;
        add_header Content-Disposition 'attachment';
        access_log /var/log/nginx/downloads.log downloads;
    }

    # Cache hashed static assets aggressively
    location ~* \.(js|css|woff2?|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
