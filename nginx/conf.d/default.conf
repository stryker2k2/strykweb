log_format downloads '$time_local | $remote_addr | $status | $body_bytes_sent bytes | "$request" | "$http_user_agent"';

server {
    listen 80;
    server_name dev.strykersoft.us;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name dev.strykersoft.us;

    ssl_certificate /etc/letsencrypt/live/dev.strykersoft.us/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.strykersoft.us/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none';" always;

    root /var/www/html;
    index index.html;

    # React SPA — send all routes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Addon / project downloads
    location /downloads/ {
        alias /var/www/downloads/;
        autoindex off;
        add_header Content-Disposition 'attachment';
        access_log /var/log/nginx/downloads.log downloads;
    }

    # Cache hashed static assets aggressively
    location ~* \.(js|css|woff2?|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
